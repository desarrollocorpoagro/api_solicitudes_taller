    <path d="M 32 15 L 60 15 C 68 15, 73 20, 73 28 L 73 38 L 48 38 L 48 48 L 73 48 L 73 60 C 73 68, 68 73, 60 73 L 32 73 C 24 73, 19 68, 19 60 L 19 28 C 19 20, 24 15, 32 15 Z" fill="#76BC21" />

